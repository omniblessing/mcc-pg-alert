name: MCC PG Notification Monitor

on:
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: 'Send one Telegram test message (manual runs only)'
        type: boolean
        default: false

concurrency:
  group: mcc-pg-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run MCC monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Run Gujarat PG monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ vars.TELEGRAM_TEST }}
        run: python gujarat_pg.py

      - name: Send manual Telegram test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from gujarat_pg import send_telegram; import sys; sys.exit(0 if send_telegram('🧪 GUJARAT PG ALERT TEST\\n\\nManual GitHub Actions delivery test.') else 1)"

      - name: Save notification state
        run: |
          git config user.name 'MCC Alert Bot'
          git config user.email 'mcc-alert-bot@users.noreply.github.com'
          git add state.json gujarat_state.json
          if git diff --cached --quiet; then
            echo 'No state change.'
          else
            git commit -m 'Update notification state'
            git push
          fi
