name: MCC PG Notification Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run MCC monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Run Gujarat PG monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ vars.TELEGRAM_TEST }}
        run: python gujarat_pg.py

      - name: Save notification state
        run: |
          git config user.name 'MCC Alert Bot'
          git config user.email 'mcc-alert-bot@users.noreply.github.com'
          git add state.json gujarat_state.json
          if git diff --cached --quiet; then
            echo 'No state change.'
          else
            git commit -m 'Update notification state'
            git push
          fi
